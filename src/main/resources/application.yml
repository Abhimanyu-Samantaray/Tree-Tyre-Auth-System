spring:
  application:
      name: Three-Tyre-Auth-System

  datasource:
    url: ${DB_URL}
    username: ${USERNAME}
    password: ${PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    user:
      name: admin
      password: admin123

server:
  port: ${PORT}

jwt:
  secret: mySuperSecretJwtKeyThatIsAtLeast32CharactersLong123
  expiration: 300000 # 5 Minutes
